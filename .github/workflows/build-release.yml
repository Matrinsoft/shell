name: Build RPM and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build RPM in Fedora container
        run: |
          mkdir -p rpm-out
          docker run --rm \
            -v "$PWD:/src" \
            -v "$PWD/rpm-out:/out" \
            -e GH_TOKEN="${{ github.token }}" \
            -e GITHUB_REPOSITORY="${{ github.repository }}" \
            -e GITHUB_SHA="${{ github.sha }}" \
            registry.fedoraproject.org/fedora:45 bash -c '
              set -euo pipefail
              export GETTEXT_SYSTEM=1
              dnf install -y -q --setopt=install_weak_deps=False \
                --setopt=minrate=0 --setopt=timeout=60 --setopt=retries=10 \
                rpm-build rpmdevtools dnf-plugins-core make git curl tar gzip xz findutils
              git config --global --add safe.directory /src
              rpmdev-setuptree
              cd /src
              SPEC=$(ls *.spec | head -1)
              cp "$SPEC" ~/rpmbuild/SPECS/
              for f in *.patch; do
                [ -f "$f" ] && cp "$f" ~/rpmbuild/SOURCES/
              done
              for f in *; do
                [ -f "$f" ] || continue
                case "$f" in
                  *.spec|*.patch) continue ;;
                esac
                cp "$f" ~/rpmbuild/SOURCES/
              done
              cd ~/rpmbuild/SPECS
              rpmspec -q --qf "%{version}\n" "$SPEC" > /out/version.txt 2>/dev/null || true

              # vendor handling for rust packages using bundled_rust_deps
              VENDOR_DEFINE=""
              if grep -q "bundled_rust_deps" "$SPEC"; then
                SRC0=$(spectool -l "$SPEC" 2>/dev/null | awk "\$1==\"Source0:\" || \$1==\"Source:\" {print \$2}" | head -1 | xargs basename 2>/dev/null)
                SRC1=$(spectool -l "$SPEC" 2>/dev/null | awk "\$2 ~ /vendor/ {print \$2}" | head -1 | xargs basename 2>/dev/null)
                SRCDIR=$(ls -d /src/*/ 2>/dev/null | grep -v "/vendor/" | grep -v "/\\.git" | head -1 | sed "s|/src/||; s|/||")
                if [ -n "$SRC1" ]; then
                  if [ -d /src/vendor ]; then
                    tar cJf ~/rpmbuild/SOURCES/"$SRC1" -C /src vendor/
                    echo "packaged vendor from /src/vendor -> $SRC1"
                  elif [ -d "/src/$SRCDIR/vendor" ]; then
                    tar cJf ~/rpmbuild/SOURCES/"$SRC1" -C "/src/$SRCDIR" vendor/
                    echo "packaged vendor from /src/$SRCDIR/vendor -> $SRC1"
                  fi
                elif [ -n "$SRC0" ] && [ -d "/src/$SRCDIR/vendor" ]; then
                  tar cJf ~/rpmbuild/SOURCES/"$SRC0" -C /src "$SRCDIR"/
                  echo "packaged full source tree (with vendor) -> $SRC0"
                fi
                if grep -q "%bcond bundled_rust_deps" "$SPEC"; then
                  VENDOR_DEFINE="_with_bundled_rust_deps 1"
                else
                  VENDOR_DEFINE="bundled_rust_deps 1"
                fi
                echo "vendor define: $VENDOR_DEFINE"
              fi

              EXTRA_ARGS=()
              if [ -n "$VENDOR_DEFINE" ]; then
                EXTRA_ARGS+=(--define "$VENDOR_DEFINE")
              fi

              # Build Source0 from this checkout so local source changes are included.
              SOURCE0_URL=$(spectool -l "$SPEC" 2>/dev/null | awk "\$1 == \"Source0:\" {print \$2; exit}")
              SOURCE0_NAME="${SOURCE0_URL##*/}"
              SOURCE0_NAME="${SOURCE0_NAME%%\?*}"
              if [ -n "$SOURCE0_NAME" ]; then
                SOURCE0_PATH="$HOME/rpmbuild/SOURCES/$SOURCE0_NAME"
                SOURCE0_ROOT="$SOURCE0_NAME"
                SOURCE0_ROOT="${SOURCE0_ROOT%.tar.xz}"
                SOURCE0_ROOT="${SOURCE0_ROOT%.tar.gz}"
                SOURCE0_ROOT="${SOURCE0_ROOT%.tar.bz2}"
                SOURCE0_ROOT="${SOURCE0_ROOT%.tar.zst}"
                if git -C /src rev-parse --verify "HEAD:$SOURCE0_ROOT" >/dev/null 2>&1; then
                  ARCHIVE_TREE="HEAD:$SOURCE0_ROOT"
                else
                  SOURCE_TREE=$(git -C /src ls-tree -d --name-only HEAD | grep -v "^\." | grep -v "\.spec$" | grep -v "\.patch$" | head -1)
                  if [ -n "$SOURCE_TREE" ]; then
                    SOURCE0_ROOT="$SOURCE_TREE"
                    ARCHIVE_TREE="HEAD:$SOURCE0_ROOT"
                  else
                    ARCHIVE_TREE="HEAD"
                  fi
                fi
                rm -f "$SOURCE0_PATH"
                case "$SOURCE0_NAME" in
                  *.tar.xz|*.tar.gz|*.tar.bz2|*.tar.zst)
                    ARCHIVE_TAR=$(mktemp)
                    DEPS_TMP=$(mktemp -d)
                    git -C /src archive --format=tar --prefix="$SOURCE0_ROOT/" "$ARCHIVE_TREE" > "$ARCHIVE_TAR"

                    # Include git submodules and Meson wrap-git dependencies in Source0.
                    while read -r mode type revision dep_path; do
                      [ "$mode" = "160000" ] || continue
                      dep_url=$(git -C /src config -f "/src/$SOURCE0_ROOT/.gitmodules" --get "submodule.$dep_path.url" || true)
                      [ -n "$dep_url" ] || continue
                      dep_dir="$DEPS_TMP/$SOURCE0_ROOT/$dep_path"
                      mkdir -p "$(dirname "$dep_dir")"
                      git clone -q --no-checkout "$dep_url" "$dep_dir"
                      git -C "$dep_dir" checkout -q "$revision"
                      rm -rf "$dep_dir/.git"
                      tar -rf "$ARCHIVE_TAR" -C "$DEPS_TMP" "$SOURCE0_ROOT/$dep_path"
                    done < <(git -C /src ls-tree -r "$ARCHIVE_TREE")

                    # Some projects declare submodules in .gitmodules without a gitlink.
                    if [ -f "/src/$SOURCE0_ROOT/.gitmodules" ]; then
                      while read -r module_key dep_path; do
                        module_name="${module_key#submodule.}"
                        module_name="${module_name%.path}"
                        dep_url=$(git -C /src config -f "/src/$SOURCE0_ROOT/.gitmodules" --get "submodule.$module_name.url" || true)
                        [ -n "$dep_path" ] || continue
                        [ -n "$dep_url" ] || continue
                        [ -d "$DEPS_TMP/$SOURCE0_ROOT/$dep_path" ] && continue
                        dep_dir="$DEPS_TMP/$SOURCE0_ROOT/$dep_path"
                        mkdir -p "$(dirname "$dep_dir")"
                        git clone -q "$dep_url" "$dep_dir"
                        rm -rf "$dep_dir/.git"
                        tar -rf "$ARCHIVE_TAR" -C "$DEPS_TMP" "$SOURCE0_ROOT/$dep_path"
                      done < <(git -C /src config -f "/src/$SOURCE0_ROOT/.gitmodules" --get-regexp '\''^submodule\..*\.path$'\'' || true)
                    fi

                    for wrap in /src/$SOURCE0_ROOT/subprojects/*.wrap; do
                      [ -f "$wrap" ] || continue
                      grep -q '\''^[[:space:]]*\[wrap-git\]'\'' "$wrap" || continue
                      dep_dir_name=$(sed -n '\''s/^[[:space:]]*directory[[:space:]]*=[[:space:]]*//p'\'' "$wrap" | head -1)
                      [ -n "$dep_dir_name" ] || dep_dir_name=$(basename "$wrap" .wrap)
                      dep_url=$(sed -n '\''s/^[[:space:]]*url[[:space:]]*=[[:space:]]*//p'\'' "$wrap" | head -1)
                      dep_revision=$(sed -n '\''s/^[[:space:]]*revision[[:space:]]*=[[:space:]]*//p'\'' "$wrap" | head -1)
                      [ -n "$dep_url" ] || continue
                      [ -n "$dep_revision" ] || dep_revision=HEAD
                      dep_dir="$DEPS_TMP/$SOURCE0_ROOT/subprojects/$dep_dir_name"
                      mkdir -p "$(dirname "$dep_dir")"
                      git clone -q --no-checkout "$dep_url" "$dep_dir"
                      git -C "$dep_dir" checkout -q "$dep_revision"
                      patch_dir=$(sed -n "s/^[[:space:]]*patch_directory[[:space:]]*=[[:space:]]*//p" "$wrap" | head -1)
                      if [ -n "$patch_dir" ] && [ -d "/src/$SOURCE0_ROOT/subprojects/packagefiles/$patch_dir" ]; then
                        cp -a "/src/$SOURCE0_ROOT/subprojects/packagefiles/$patch_dir/." "$dep_dir/"
                      fi
                      rm -rf "$dep_dir/.git"
                      tar -rf "$ARCHIVE_TAR" -C "$DEPS_TMP" "$SOURCE0_ROOT/subprojects/$dep_dir_name"
                    done
                    rm -rf "$DEPS_TMP"
                    case "$SOURCE0_NAME" in
                      *.tar.xz) xz -c < "$ARCHIVE_TAR" > "$SOURCE0_PATH" ;;
                      *.tar.gz) gzip -c < "$ARCHIVE_TAR" > "$SOURCE0_PATH" ;;
                      *.tar.bz2) bzip2 -c < "$ARCHIVE_TAR" > "$SOURCE0_PATH" ;;
                      *.tar.zst) zstd -q -c < "$ARCHIVE_TAR" > "$SOURCE0_PATH" ;;
                    esac
                    rm -f "$ARCHIVE_TAR"
                    ;;
                  *)
                    echo "Unsupported Source0 archive format: $SOURCE0_NAME" >&2
                    exit 1
                    ;;
                esac
                test -s "$SOURCE0_PATH"
                cp "$SOURCE0_PATH" /out/
                RELEASE_TAG="ci-${GITHUB_SHA:0:12}"
                RELEASE_API="https://api.github.com/repos/$GITHUB_REPOSITORY/releases"
                RELEASE_JSON=$(curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" "$RELEASE_API/tags/$RELEASE_TAG" 2>/dev/null || true)
                if [ -z "$RELEASE_JSON" ]; then
                  RELEASE_JSON=$(curl -fsS -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" "$RELEASE_API" -d "{\"tag_name\":\"$RELEASE_TAG\",\"name\":\"$RELEASE_TAG\",\"prerelease\":true}")
                fi
                RELEASE_ID=$(printf '\''%s'\'' "$RELEASE_JSON" | sed -n '\''s/.*"id":[[:space:]]*\([0-9][0-9]*\).*/\1/p'\'' | head -1)
                [ -n "$RELEASE_ID" ] || { echo "Unable to determine GitHub Release ID" >&2; exit 1; }
                UPLOAD_URL="https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$SOURCE0_NAME"
                if ! curl -fsS -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" --data-binary "@$SOURCE0_PATH" "$UPLOAD_URL" >/dev/null; then
                  echo "Source0 asset already exists; retaining the published asset"
                fi
                RELEASE_SOURCE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$SOURCE0_NAME"
                sed -Ei "0,/^[[:space:]]*Source0:/s#^[[:space:]]*Source0:.*#Source0: $RELEASE_SOURCE_URL#" "$HOME/rpmbuild/SPECS/$SPEC"
                echo "Published Source0: $RELEASE_SOURCE_URL"
                echo "Built local Source0: $SOURCE0_NAME (tree: $ARCHIVE_TREE)"
              else
                echo "No Source0 found; retaining the spec other source handling"
              fi

              spectool -g -R *.spec || echo "spectool: some sources may already be local"
              dnf builddep -y -q --setopt=minrate=0 --setopt=timeout=60 --setopt=retries=10 "${EXTRA_ARGS[@]}" *.spec
              rpmbuild -ba --nocheck "${EXTRA_ARGS[@]}" *.spec
              cp ~/rpmbuild/SRPMS/*.src.rpm /out/ 2>/dev/null || true
              find ~/rpmbuild/RPMS -name "*.rpm" -exec cp {} /out/ \; 2>/dev/null || true
              ls -la /out/
            ' > build.log 2>&1 || { tail -100 build.log; exit 1; }

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="ci-${GITHUB_SHA::12}"
          echo "Release: $TAG"
          shopt -s nullglob
          rpms=(rpm-out/*.rpm)
          if [ ${#rpms[@]} -eq 0 ]; then
            echo "::warning::No rpm files produced"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${rpms[@]}" --clobber
          else
            gh release create "$TAG" "${rpms[@]}" --generate-notes
          fi
          echo "Published release $TAG"
