name: Build RPM and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build RPM in Fedora container
        run: |
          mkdir -p rpm-out
          docker run --rm \
            -v "$PWD:/src" \
            -v "$PWD/rpm-out:/out" \
            registry.fedoraproject.org/fedora:45 bash -c '
              set -euo pipefail
              dnf install -y -q --setopt=install_weak_deps=False \
                --setopt=minrate=0 --setopt=timeout=60 --setopt=retries=10 \
                rpm-build rpmdevtools dnf-plugins-core
              rpmdev-setuptree
              cd /src
              SPEC=$(ls *.spec | head -1)
              cp "$SPEC" ~/rpmbuild/SPECS/
              for f in *.patch; do
                [ -f "$f" ] && cp "$f" ~/rpmbuild/SOURCES/
              done
              for f in *; do
                [ -f "$f" ] || continue
                case "$f" in
                  *.spec|*.patch) continue ;;
                esac
                cp "$f" ~/rpmbuild/SOURCES/
              done
              cd ~/rpmbuild/SPECS
              rpmspec -q --qf "%{version}\n" "$SPEC" > /out/version.txt 2>/dev/null || true
              spectool -g -R *.spec || echo "spectool: some sources may already be local"
              dnf builddep -y -q --setopt=minrate=0 --setopt=timeout=60 --setopt=retries=10 *.spec
              rpmbuild -ba --nocheck *.spec
              cp ~/rpmbuild/SRPMS/*.src.rpm /out/ 2>/dev/null || true
              find ~/rpmbuild/RPMS -name "*.rpm" -exec cp {} /out/ \; 2>/dev/null || true
              ls -la /out/
            ' > build.log 2>&1 || { tail -80 build.log; exit 1; }

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(cat rpm-out/version.txt 2>/dev/null | head -1 | tr -d '\r')"
          if [ -z "$VERSION" ]; then
            SPEC=$(ls *.spec | head -1)
            VERSION="$(grep -m1 '^Version:' "$SPEC" | sed 's/^Version:[[:space:]]*//' | tr -d '\r')"
          fi
          TAG="v$(echo "$VERSION" | tr '~' '-')"
          echo "Tag: $TAG"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created tag $TAG"
          else
            echo "Tag $TAG already exists"
          fi
          shopt -s nullglob
          rpms=(rpm-out/*.rpm)
          if [ ${#rpms[@]} -eq 0 ]; then
            echo "::warning::No rpm files produced"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${rpms[@]}" --clobber
          else
            gh release create "$TAG" "${rpms[@]}" --generate-notes
          fi
          echo "Published release $TAG"
